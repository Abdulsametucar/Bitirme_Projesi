{% extends 'base.html' %}

{% block content %}
<div class="row g-4 h-100 flex-grow-1 overflow-hidden">
    <!-- Sol Panel: Canli Kamera Akisi -->
    <div class="col-lg-7 col-xl-8 d-flex flex-column h-100 pb-2">
        <div class="card bg-secondary border-0 shadow-lg d-flex flex-column h-100 feed-card">
            <div class="card-header bg-dark border-secondary d-flex justify-content-between align-items-center py-2 flex-shrink-0">
                <h5 class="card-title mb-0 text-light fw-bold">
                    <i class="fa-solid fa-video text-danger me-2 flash-icon"></i> Canlı Kamera Akışı
                </h5>
                <span class="badge bg-success">Canlı</span>
            </div>
            <div class="card-body p-0 d-flex justify-content-center align-items-center bg-dark overflow-hidden flex-grow-1 position-relative" style="border-radius: 0 0 12px 12px;">
                <img id="video_feed" src="{{ url_for('video_feed') }}" class="img-fluid" style="width: 100%; height: 100%; object-fit: contain;" alt="Video Feed Yükleniyor...">
            </div>
        </div>
    </div>

    <!-- Sag Panel: Istatistikler ve Tablolar -->
    <div class="col-lg-5 col-xl-4 d-flex flex-column h-100 gap-3 pb-2 overflow-hidden">

        <!-- Grafik Kartı (Kompakt) -->
        <div class="card bg-dark border-secondary shadow-lg flex-shrink-0">
            <div class="card-header bg-dark border-secondary py-2">
                <h5 class="card-title mb-0 text-light fw-bold text-center">
                    <i class="fa-solid fa-chart-line text-warning me-2"></i> Genel İstatistikler
                </h5>
            </div>
            <div class="card-body p-3">
                <div class="row text-center align-items-center">
                    <!-- İşlem Başarı Durumu -->
                    <div class="col-6 border-end border-secondary">
                        <h6 class="text-white-50 mb-1 small">Toplam İşlem</h6>
                        <h4 class="text-white fw-bold mb-2" id="chart_total_ops">0</h4>
                        <div style="height: 120px; width: 100%; display: flex; justify-content: center;">
                            <canvas id="successChart"></canvas>
                        </div>
                    </div>
                    <!-- Ortalama Süre -->
                    <div class="col-6">
                        <h6 class="text-white-50 mb-1 small">Ortalama Süre</h6>
                        <h4 class="text-info fw-bold mb-2" id="chart_avg_time">0s</h4>
                        <div style="height: 120px; width: 100%; display: flex; justify-content: center;">
                            <canvas id="gaugeChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- Isci Performans Tablosu -->
        <div class="card bg-dark border-secondary shadow-lg d-flex flex-column flex-grow-1 overflow-hidden table-card">
            <div class="card-header bg-dark border-secondary py-2 d-flex justify-content-between align-items-center flex-shrink-0">
                <h5 class="card-title mb-0 text-light fw-bold">
                    <i class="fa-solid fa-users-gear text-info me-2"></i> Havlu işlemleri adımları
                </h5>
                <small class="text-muted" id="last_updated">Güncelleniyor...</small>
            </div>
            <div class="card-body p-0 d-flex flex-column overflow-hidden flex-grow-1">
                <div class="table-responsive flex-grow-1 overflow-auto" style="max-height: none;">
                    <table class="table table-dark table-hover table-borderless mb-0 align-middle">
                        <thead class="table-secondary text-light">
                            <tr>
                                <th class="ps-3">İşçi Adı</th>
                                <th>Adım Adı</th>
                                <th class="text-end pe-3">Geçen Süre (sn)</th>
                            </tr>
                        </thead>
                        <tbody id="worker_table_body">
                            <!-- JS tarafindan doldurulacak -->
                            <tr>
                                <td colspan="3" class="text-center text-muted py-4">
                                    <div class="spinner-border spinner-border-sm text-secondary me-2" role="status">
                                    </div>
                                    Veriler Yükleniyor...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/js/dashboard.js"></script>
{% endblock %}
