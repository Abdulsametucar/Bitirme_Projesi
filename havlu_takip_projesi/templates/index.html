{% extends 'base.html' %}

{% block content %}
<div class="row g-4">
    <!-- Sol Panel: Canli Kamera Akisi -->
    <div class="col-lg-7 col-xl-8">
        <div class="card bg-secondary border-0 shadow-lg h-100 feed-card">
            <div class="card-header bg-dark border-secondary d-flex justify-content-between align-items-center py-3">
                <h5 class="card-title mb-0 text-light fw-bold">
                    <i class="fa-solid fa-video text-danger me-2 flash-icon"></i> Canlı Kamera Akışı
                </h5>
                <span class="badge bg-success">Canlı</span>
            </div>
            <div class="card-body p-0 d-flex justify-content-center align-items-center bg-black overflow-hidden position-relative">
                <img id="video_feed" src="{{ url_for('video_feed') }}" class="img-fluid w-100" alt="Video Feed Yükleniyor...">
            </div>
        </div>
    </div>

    <!-- Sag Panel: Istatistikler ve Tablolar -->
    <div class="col-lg-5 col-xl-4 d-flex flex-column gap-4">
        
        <!-- Ozet Kartlari -->
        <div class="row g-3">
            <div class="col-sm-6">
                <div class="card bg-primary text-white border-0 shadow-sm h-100 stat-card">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-3">
                        <i class="fa-solid fa-boxes-packing fa-2x mb-2 text-white-50"></i>
                        <h6 class="card-subtitle mb-1 text-white-50">Toplam İşlem</h6>
                        <h2 class="card-title mb-0 fw-bold" id="total_ops">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="card bg-success text-white border-0 shadow-sm h-100 stat-card">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-3">
                        <i class="fa-solid fa-check-circle fa-2x mb-2 text-white-50"></i>
                        <h6 class="card-subtitle mb-1 text-white-50">Başarı Oranı</h6>
                        <h2 class="card-title mb-0 fw-bold" id="success_rate">%0</h2>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="card bg-info text-white border-0 shadow-sm h-100 stat-card">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-3">
                        <i class="fa-solid fa-stopwatch fa-2x mb-2 text-white-50"></i>
                        <h6 class="card-subtitle mb-1 text-white-50">Ort. Süre</h6>
                        <h2 class="card-title mb-0 fw-bold" id="avg_time">0s</h2>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="card bg-danger text-white border-0 shadow-sm h-100 stat-card">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center text-center p-3">
                        <i class="fa-solid fa-triangle-exclamation fa-2x mb-2 text-white-50"></i>
                        <h6 class="card-subtitle mb-1 text-white-50">Hatalı</h6>
                        <h2 class="card-title mb-0 fw-bold" id="total_errors">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Isci Performans Tablosu -->
        <div class="card bg-dark border-secondary shadow-lg flex-grow-1 table-card">
            <div class="card-header bg-dark border-secondary py-3 d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0 text-light fw-bold">
                    <i class="fa-solid fa-users-gear text-info me-2"></i> İşçi Performansları
                </h5>
                <small class="text-muted" id="last_updated">Güncelleniyor...</small>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover table-borderless mb-0 align-middle">
                        <thead class="table-secondary text-light">
                            <tr>
                                <th class="ps-3">İşçi Adı</th>
                                <th>Adım Adı</th>
                                <th class="text-end pe-3">Geçen Süre (sn)</th>
                            </tr>
                        </thead>
                        <tbody id="worker_table_body">
                            <!-- JS tarafindan doldurulacak -->
                            <tr>
                                <td colspan="3" class="text-center text-muted py-4">
                                    <div class="spinner-border spinner-border-sm text-secondary me-2" role="status"></div>
                                    Veriler Yükleniyor...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
